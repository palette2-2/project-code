[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thor-deploy"
version = "0.1.0"
description = "ONNX policy deployment for Unitree G1 with optional PICO and Dex3 teleoperation"
readme = "README.md"
requires-python = ">=3.8"
# No blanket SPDX license: see LICENSE.md for inherited component licenses.
license = {file = "LICENSE.md"}
dependencies = [
    "numpy>=1.21,<3",
    "torch>=2.0",
    "onnxruntime>=1.16",
    "lcm>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
network = ["netifaces>=0.11"]

[project.scripts]
thor-deploy = "thor_deploy.policy:main"

[tool.setuptools]
license-files = ["LICENSE.md", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["thor_deploy*"]
namespaces = false

[tool.setuptools.package-data]
"thor_deploy.lcm_types" = ["*.lcm", "*.hpp"]

[tool.black]
line-length = 88
target-version = ["py38"]
extend-exclude = "/(third_party|lcm_types)/"
